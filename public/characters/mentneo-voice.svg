<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="sticker-glow-voice" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FB7185" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="body-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="ear-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
  </defs>

  <g filter="url(#sticker-glow-voice)">
    <!-- White Sticker Cut-out Outline -->
    <path d="M 120 40 L 160 100 L 240 100 L 280 40 C 310 80 320 120 320 180 C 320 260 270 330 200 330 C 130 330 80 260 80 180 C 80 120 90 80 120 40 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" />

    <!-- Left & Right Ears -->
    <polygon points="120,50 160,110 95,120" fill="url(#body-coral)" />
    <polygon points="123,65 150,105 105,115" fill="url(#ear-inner)" />
    <polygon points="280,50 240,110 305,120" fill="url(#body-coral)" />
    <polygon points="277,65 250,105 295,115" fill="url(#ear-inner)" />

    <!-- Main Head Body -->
    <ellipse cx="200" cy="180" rx="100" ry="95" fill="url(#body-coral)" />

    <!-- Gloss Highlight -->
    <ellipse cx="165" cy="125" rx="35" ry="16" fill="#FFFFFF" opacity="0.4" transform="rotate(-15, 165, 125)" />

    <!-- Face Plate -->
    <path d="M 140 160 C 140 135 260 135 260 160 C 260 215 140 215 140 160 Z" fill="#4C0519" stroke="#FECDD3" stroke-width="3" />

    <!-- Expressive Eyes -->
    <ellipse cx="170" cy="165" rx="12" ry="16" fill="#FFFFFF" />
    <ellipse cx="230" cy="165" rx="12" ry="16" fill="#FFFFFF" />
    <circle cx="172" cy="163" r="8" fill="#BE123C" />
    <circle cx="232" cy="163" r="8" fill="#BE123C" />
    <circle cx="174" cy="160" r="3" fill="#FFFFFF" />
    <circle cx="234" cy="160" r="3" fill="#FFFFFF" />

    <!-- Cute Nose & Mouth -->
    <polygon points="196,182 204,182 200,186" fill="#FDA4AF" />
    <path d="M 194 190 Q 200 196 206 190" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Dynamic Sound Wave Collar / Ring -->
    <g transform="translate(130, 240)">
      <path d="M 0 15 Q 35 -5 70 15 Q 105 35 140 15" fill="none" stroke="#FFE4E6" stroke-width="6" stroke-linecap="round" />
      <circle cx="20" cy="15" r="7" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="70" cy="15" r="9" fill="#FB7185" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="120" cy="15" r="7" fill="#F43F5E" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Sub-150ms Speech Wave Ribbon -->
    <path d="M 155 285 Q 200 270 245 285" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
    <text x="200" y="315" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">SUB-150MS DUPLEX</text>

    <!-- Sparkles -->
    <polygon points="75,170 80,180 90,185 80,190 75,200 70,190 60,185 70,180" fill="#FDE047" />
    <polygon points="325,170 330,180 340,185 330,190 325,200 320,190 310,185 320,180" fill="#FDE047" />
  </g>
</svg>
