<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="sticker-glow-chat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="body-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="bubble-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
  </defs>

  <g filter="url(#sticker-glow-chat)">
    <!-- White Outline Silhouette -->
    <path d="M 200 45 C 135 45 95 90 95 160 C 75 165 65 190 70 215 C 75 235 95 245 105 245 C 115 315 155 350 200 350 C 245 350 285 315 295 245 C 305 245 325 235 330 215 C 335 190 325 165 305 160 C 305 90 265 45 200 45 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" />

    <!-- Chat Antenna Base & Orb -->
    <path d="M 200 45 L 200 15" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <circle cx="200" cy="15" r="14" fill="#FFFFFF" />
    <path d="M 200 45 L 200 15" stroke="#67E8F9" stroke-width="8" stroke-linecap="round" />
    <circle cx="200" cy="15" r="10" fill="#FDE047" />

    <!-- Main Cyan Orb Body -->
    <rect x="105" y="75" width="190" height="235" rx="95" fill="url(#body-cyan)" />

    <!-- Gloss Highlight -->
    <ellipse cx="160" cy="115" rx="40" ry="20" fill="#FFFFFF" opacity="0.35" transform="rotate(-15, 160, 115)" />

    <!-- Face Screen -->
    <rect x="130" y="130" width="140" height="90" rx="32" fill="#042F2E" stroke="#A5F3FC" stroke-width="4" />

    <!-- Cute Curved Digital Eyes -->
    <path d="M 155 170 Q 168 152 180 170" fill="none" stroke="#67E8F9" stroke-width="6" stroke-linecap="round" />
    <path d="M 220 170 Q 232 152 245 170" fill="none" stroke="#67E8F9" stroke-width="6" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 188 192 Q 200 204 212 192" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round" />

    <!-- Floating Chat Bubble Accessory (Left) -->
    <g transform="translate(60, 100)">
      <rect x="0" y="0" width="60" height="42" rx="14" fill="#FFFFFF" />
      <polygon points="12,42 22,42 8,54" fill="#FFFFFF" />
      <rect x="4" y="4" width="52" height="34" rx="10" fill="url(#bubble-pink)" />
      <!-- Dots inside bubble -->
      <circle cx="18" cy="21" r="3.5" fill="#FFFFFF" />
      <circle cx="30" cy="21" r="3.5" fill="#FFFFFF" />
      <circle cx="42" cy="21" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Chest 128K Badge -->
    <rect x="155" y="245" width="90" height="30" rx="15" fill="#083344" stroke="#67E8F9" stroke-width="2" />
    <text x="200" y="265" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#A5F3FC" text-anchor="middle">128K CONTEXT</text>

    <!-- Floating Sparkles -->
    <polygon points="315,95 320,110 335,115 320,120 315,135 310,120 295,115 310,110" fill="#67E8F9" />
  </g>
</svg>
