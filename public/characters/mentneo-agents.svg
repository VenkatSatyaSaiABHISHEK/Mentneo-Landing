<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="sticker-glow-agents" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <linearGradient id="body-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="core-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <g filter="url(#sticker-glow-agents)">
    <!-- White Sticker Silhouette with Drone Wings -->
    <path d="M 200 40 C 145 40 120 70 120 125 L 60 160 L 60 210 L 120 220 L 125 290 C 135 340 165 355 200 355 C 235 355 265 340 275 290 L 280 220 L 340 210 L 340 160 L 280 125 C 280 70 255 40 200 40 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round" />

    <!-- Left & Right Drone Wings -->
    <polygon points="120,135 55,170 55,200 120,210" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" />
    <circle cx="85" cy="185" r="7" fill="#60A5FA" />
    <polygon points="280,135 345,170 345,200 280,210" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" />
    <circle cx="315" cy="185" r="7" fill="#60A5FA" />

    <!-- Main Robot Torso & Head -->
    <path d="M 200 50 C 145 50 128 90 128 150 C 128 240 150 340 200 340 C 250 340 272 240 272 150 C 272 90 255 50 200 50 Z"
          fill="url(#body-blue)" />

    <!-- Highlights -->
    <ellipse cx="160" cy="100" rx="30" ry="12" fill="#FFFFFF" opacity="0.4" transform="rotate(-15, 160, 100)" />

    <!-- Futuristic Cyclops Visor -->
    <rect x="140" y="125" width="120" height="42" rx="21" fill="#0F172A" stroke="#93C5FD" stroke-width="3" />
    <rect x="155" y="137" width="90" height="18" rx="9" fill="url(#core-blue)" />
    <!-- Visor Scan Glint -->
    <circle cx="210" cy="146" r="6" fill="#FFFFFF" />

    <!-- Multi-Agent Orchestrator Energy Core on Chest -->
    <circle cx="200" cy="225" r="32" fill="#0F172A" stroke="#60A5FA" stroke-width="4" />
    <circle cx="200" cy="225" r="22" fill="url(#core-blue)" />
    <!-- Orbiting Tool Dots -->
    <circle cx="200" cy="198" r="4.5" fill="#FDE047" />
    <circle cx="224" cy="235" r="4.5" fill="#38BDF8" />
    <circle cx="176" cy="235" r="4.5" fill="#4ADE80" />

    <!-- Status Bar -->
    <rect x="155" y="275" width="90" height="24" rx="12" fill="#1E3A8A" stroke="#BFDBFE" stroke-width="2" />
    <text x="200" y="291" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">SWARM ACTIVE</text>

    <!-- Sparkles -->
    <polygon points="320,85 325,95 335,100 325,105 320,115 315,105 305,100 315,95" fill="#93C5FD" />
  </g>
</svg>
