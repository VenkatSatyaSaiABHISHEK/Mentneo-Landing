<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="sticker-glow-chip" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#38BDF8" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <linearGradient id="body-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gold-pins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="core-quantum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <g filter="url(#sticker-glow-chip)">
    <!-- White Sticker Cut-out Border for Chip Package -->
    <rect x="75" y="75" width="250" height="250" rx="36" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round" />

    <!-- External Gold Connector Pins (Top, Bottom, Left, Right) -->
    <!-- Top Pins -->
    <rect x="120" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="150" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="180" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="210" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="240" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="270" y="55" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <!-- Bottom Pins -->
    <rect x="120" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="150" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="180" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="210" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="240" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />
    <rect x="270" y="322" width="12" height="24" rx="4" fill="url(#gold-pins)" />

    <!-- Main Chrome Chip Carrier Substrate -->
    <rect x="85" y="85" width="230" height="230" rx="28" fill="url(#body-chrome)" stroke="#38BDF8" stroke-width="3" />

    <!-- Silicon Die Core (Center 2.2mm Wafer representation) -->
    <rect x="125" y="125" width="150" height="150" rx="18" fill="#030712" stroke="#0EA5E9" stroke-width="4" />

    <!-- Microscopic Circuit Grid Traces -->
    <path d="M 140 145 H 175 V 170 H 195" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <path d="M 260 145 H 225 V 170 H 205" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <path d="M 140 255 H 175 V 230 H 195" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    <path d="M 260 255 H 225 V 230 H 205" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.8" />

    <!-- Center Glowing Quantum Neural NPU Core -->
    <circle cx="200" cy="200" r="28" fill="url(#core-quantum)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="200" cy="200" r="14" fill="#FFFFFF" />

    <!-- Chip Branding Inscriptions -->
    <text x="200" y="112" font-family="'Courier New', monospace" font-weight="900" font-size="12" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">MENTNEO HGI</text>
    <text x="200" y="292" font-family="'Courier New', monospace" font-weight="800" font-size="11" fill="#38BDF8" text-anchor="middle" letter-spacing="1">2.2 MM · 0.4W</text>

    <!-- Chrome Specular Diagonal Sheen -->
    <polygon points="90,140 150,85 180,85 105,155" fill="#FFFFFF" opacity="0.25" />

    <!-- Sparkles -->
    <polygon points="310,95 315,108 328,113 315,118 310,131 305,118 292,113 305,108" fill="#FDE047" />
  </g>
</svg>
