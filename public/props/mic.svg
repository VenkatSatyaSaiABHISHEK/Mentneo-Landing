<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="100%" height="100%">
  <defs>
    <filter id="mic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FB7185" flood-opacity="0.5" />
    </filter>
    <linearGradient id="mic-coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>
  <g filter="url(#mic-glow)">
    <!-- Base stand outline -->
    <path d="M 40 70 C 40 100 100 100 100 70 M 70 100 V 135 M 45 135 H 95" 
          stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 40 70 C 40 100 100 100 100 70 M 70 100 V 135 M 45 135 H 95" 
          stroke="#FDA4AF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Mic Capsule Outline & Body -->
    <rect x="50" y="25" width="40" height="65" rx="20" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" />
    <rect x="52" y="27" width="36" height="61" rx="18" fill="url(#mic-coral-grad)" />
    <!-- Mesh Grille lines -->
    <line x1="58" y1="42" x2="82" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="52" x2="82" y2="52" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="62" x2="82" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Recording Red Dot -->
    <circle cx="70" cy="74" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
